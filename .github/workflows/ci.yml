name: CI
on:
  push:
    branches: [main, nextjs-cinematic-rebuild]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      DEFAULT_FULFILLMENT_PROVIDER: "manual"
      FULFILLMENT_LIVE_ENABLED: "false"
      AMAZON_MCF_ENABLED: "false"
      SHIPROCKET_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run preflight
      - run: npm run lint
      - run: npm run test:arch
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:cf
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deploy:
    # Staging CD: only main deploys, and only after every verify stage passes.
    # PRs never deploy. workflow_dispatch re-runs verify + deploy for current main.
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Public build configuration for the staging Worker. Kept inline so a
      # missing repository variable cannot silently produce a broken build.
      # Server-side secrets live as Cloudflare Worker secrets, not here.
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_SITE_URL: "https://relapse-perfume-store.glm-panther.workers.dev"
      NEXT_PUBLIC_BRAND_NAME: "RELAPSE"
      NEXT_PUBLIC_SUPABASE_URL: "https://ejpvxmqeidatcqisrutu.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_AgTC31D9G_Wm4zkeORCbaA_I8Y5r6oP"
      PAYMENT_PROVIDER: "mock"
      PAYMENTS_LIVE_ENABLED: "false"
      MOCK_PAYMENTS_ENABLED: "false"
      FULFILLMENT_LIVE_ENABLED: "false"
      DEFAULT_FULFILLMENT_PROVIDER: "manual"
      AMAZON_MCF_ENABLED: "false"
      SHIPROCKET_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run deploy
      - name: Smoke test staging URL
        run: |
          set -euo pipefail
          BASE="https://relapse-perfume-store.glm-panther.workers.dev"
          for p in "/" "/shop" "/product/invictus" "/samples" "/checkout" "/robots.txt" "/sitemap.xml"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 --retry 3 --retry-delay 2 "$BASE$p")
            echo "$p -> $code"
            [ "$code" = "200" ]
          done
          curl -s --max-time 30 "$BASE/sitemap.xml" | grep -q "relapse-perfume-store.glm-panther.workers.dev"
          echo "Smoke OK: canonical staging URL healthy"
